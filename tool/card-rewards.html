      </div>
    </div>

  </main>
  <script id="card-rewards-core">
    function normalizeText(value) {
      return String(value ?? "").normalize("NFKC").trim().toLocaleLowerCase("zh-TW");
    }

    function collectText(value, output = []) {
      if (typeof value === "string") output.push(value);
      else if (Array.isArray(value)) value.forEach(item => collectText(item, output));
      else if (value && typeof value === "object") Object.values(value).forEach(item => collectText(item, output));
      return output;
    }

    function cardMatchesQuery(card, query) {
      const needle = normalizeText(query);
      return !needle || normalizeText(collectText(card).join(" ")).includes(needle);
    }

    function cardMatchesFilters(card, filters) {
      const inGroup = (selected, values) => !selected.size || values.some(value => selected.has(value));
      return inGroup(filters.facets, card.facetIds)
        && inGroup(filters.coverage, [card.coverageStatus])
        && inGroup(filters.productTypes, [card.productType]);
    }

    function filterCards(cards, filters) {
      return cards.filter(card => cardMatchesQuery(card, filters.query) && cardMatchesFilters(card, filters));
    }

    globalThis.CardRewardsCore = { normalizeText, collectText, cardMatchesQuery, cardMatchesFilters, filterCards };
  </script>

  <script>
    (() => {
      "use strict";

      const state = {
        query: "",
        facets: new Set(),
        coverage: new Set(),
        productTypes: new Set(),
        selectedIds: [],
        detailId: null
      };
      const facetLabels = {
        "line-pay": "LINE Pay", "ipass-money": "iPASS MONEY", "px-pay": "PX Pay", "overseas": "海外消費",
        "subscriptions": "數位訂閱", "transport": "交通與加油", "costco": "量販與 Costco"
      };
      const coverageLabels = { complete: "完整", partial: "部分", unavailable: "未提供" };
      const typeLabels = { "credit-card": "信用卡", "debit-card": "簽帳金融卡" };
      const app = document.getElementById("app");
      const fatalError = document.getElementById("fatal-error");
      const search = document.getElementById("search");
      const resultCount = document.getElementById("result-count");
      const clearFilters = document.getElementById("clear-filters");
      const facetControls = document.getElementById("facet-controls");
      const coverageControls = document.getElementById("coverage-controls");
      const typeControls = document.getElementById("type-controls");
      const cardGrid = document.getElementById("card-grid");
      const emptyState = document.getElementById("empty-state");
      const emptyClear = document.getElementById("empty-clear");
      const compareTray = document.getElementById("compare-tray");
      let cards = [];

      const create = (tag, text, className) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined && text !== null) element.textContent = text;
        return element;
      };

      const clearChildren = element => element.replaceChildren();
      const labelFor = (labels, value) => labels[value] || value;

      function clearDiscovery() {
        state.query = "";
        state.facets.clear();
        state.coverage.clear();
        state.productTypes.clear();
        state.detailId = null;
        render();
        search.focus();
      }

      function createFilterButtons(container, values, selected, labels, onChange) {
        clearChildren(container);
        values.forEach(value => {
          const button = create("button", labelFor(labels, value), "facet-button");
          button.type = "button";
          button.setAttribute("aria-pressed", String(selected.has(value)));
          button.addEventListener("click", () => {
            if (selected.has(value)) selected.delete(value);
            else selected.add(value);
            onChange();
          });
          container.append(button);
        });
      }

      function renderFilters() {
        const unique = key => [...new Set(cards.flatMap(card => Array.isArray(card[key]) ? card[key] : [card[key]]))].filter(Boolean);
        createFilterButtons(facetControls, unique("facetIds"), state.facets, facetLabels, render);
        createFilterButtons(coverageControls, unique("coverageStatus"), state.coverage, coverageLabels, render);
        createFilterButtons(typeControls, unique("productType"), state.productTypes, typeLabels, render);
      }

      function appendReward(list, label, value) {
        const item = create("div");
        item.append(create("dt", label));
        item.append(create("dd", value || "未提供"));
        list.append(item);
      }

      function renderCard(card) {
        const article = create("article", undefined, "card");
        article.append(create("p", card.issuer, "issuer"));
        article.append(create("h2", card.product));
        article.append(create("p", labelFor(typeLabels, card.productType), "card-type"));
        const rewards = create("dl", undefined, "reward-list");
        appendReward(rewards, "國內一般消費", card.comparison?.domestic);
        appendReward(rewards, "海外消費", card.comparison?.overseas);
        appendReward(rewards, "最佳特殊回饋", card.comparison?.bestSpecial);
        appendReward(rewards, "上限／條件", [card.comparison?.capAndDerivedSpend, card.comparison?.conditions].filter(Boolean).join("；"));
        article.append(rewards);
        const badges = create("div", undefined, "badges");
        badges.append(create("span", labelFor(coverageLabels, card.coverageStatus), `badge badge--${card.coverageStatus}`));
        (card.badges || []).forEach(badge => badges.append(create("span", badge, "badge")));
        article.append(badges);
        const actions = create("div", undefined, "card-actions");
        const detailButton = create("button", state.detailId === card.id ? "收合詳情" : "查看詳情", "secondary-button");
        detailButton.type = "button";
        detailButton.setAttribute("aria-expanded", String(state.detailId === card.id));
        detailButton.addEventListener("click", () => { state.detailId = state.detailId === card.id ? null : card.id; render(); });
        const compareButton = create("button", state.selectedIds.includes(card.id) ? "移出比較" : "加入比較", "secondary-button");
        compareButton.type = "button";
        compareButton.setAttribute("aria-pressed", String(state.selectedIds.includes(card.id)));
        compareButton.addEventListener("click", () => {
          state.selectedIds = state.selectedIds.includes(card.id)
            ? state.selectedIds.filter(id => id !== card.id)
            : [...state.selectedIds, card.id];
          render();
        });
        actions.append(detailButton, compareButton);
        article.append(actions);
        const detail = create("section", undefined, "detail");
        detail.hidden = state.detailId !== card.id;
        detail.append(create("h3", "條件與說明"));
        detail.append(create("p", card.comparison?.conditions || "未提供"));
        article.append(detail);
        return article;
      }

      function renderCompareTray() {
        clearChildren(compareTray);
        const selected = state.selectedIds.map(id => cards.find(card => card.id === id)).filter(Boolean);
        compareTray.hidden = selected.length === 0;
        if (!selected.length) return;
        compareTray.append(create("h2", `比較清單（${selected.length}）`));
        const list = create("ul", undefined, "compare-list");
        selected.forEach(card => list.append(create("li", `${card.issuer} ${card.product}`)));
        compareTray.append(list);
      }

      function render() {
        search.value = state.query;
        renderFilters();
        const filtered = CardRewardsCore.filterCards(cards, state);
        resultCount.textContent = `找到 ${filtered.length} 項產品（共 ${cards.length} 項）`;
        clearChildren(cardGrid);
        filtered.forEach(card => cardGrid.append(renderCard(card)));
        emptyState.hidden = filtered.length !== 0;
        const hasFilters = Boolean(state.query || state.facets.size || state.coverage.size || state.productTypes.size);
        clearFilters.disabled = !hasFilters;
        renderCompareTray();
      }

      function showFatal(error) {
        app.classList.add("is-fatal");
        fatalError.hidden = false;
        clearChildren(fatalError);
        fatalError.append(create("p", "資料無法載入；請重新產生 card-rewards.html。"));
        fatalError.append(create("p", error instanceof Error ? error.message : String(error)));
      }

      function validateCard(card, index) {
        if (!card || typeof card !== "object" || Array.isArray(card)) throw new Error(`第 ${index + 1} 張卡片資料格式不正確。`);
        for (const field of ["id", "issuer", "product", "coverageStatus", "productType"]) {
          if (typeof card[field] !== "string") throw new Error(`第 ${index + 1} 張卡片缺少 ${field}。`);
        }
        if (!Array.isArray(card.facetIds)) throw new Error(`第 ${index + 1} 張卡片的 facetIds 格式不正確。`);
        if (!Array.isArray(card.badges)) throw new Error(`第 ${index + 1} 張卡片的 badges 格式不正確。`);
        if (!card.comparison || typeof card.comparison !== "object" || Array.isArray(card.comparison)) {
          throw new Error(`第 ${index + 1} 張卡片的 comparison 格式不正確。`);
        }
      }

      function bootstrap() {
        try {
          const dataElement = document.getElementById("card-rewards-data");
          if (!dataElement) throw new Error("找不到內嵌資料。");
          const dataset = JSON.parse(dataElement.textContent);
          if (dataset.schemaVersion !== "1") throw new Error("資料版本不支援。");
          if (!Array.isArray(dataset.cards) || dataset.cards.length !== 15) throw new Error("信用卡資料筆數不正確。");
          if (!Array.isArray(dataset.payments) || dataset.payments.length !== 3) throw new Error("行動支付資料筆數不正確。");
          dataset.cards.forEach(validateCard);
          cards = dataset.cards;
          search.addEventListener("input", () => { state.query = search.value; render(); });
          clearFilters.addEventListener("click", clearDiscovery);
          emptyClear.addEventListener("click", clearDiscovery);
          render();
        } catch (error) {
          showFatal(error);
        }
      }

      bootstrap();
    })();
  </script>
</body>
