  <script>
  (function () {
    "use strict";
    const Core = globalThis.ImageStackMprCore;
    const input = document.getElementById("image-file-input");
    const status = document.getElementById("import-status");
    const sequenceCountControl = document.getElementById("sequence-count");
    const boundaryControls = document.getElementById("boundary-controls");
    const sequenceLanes = document.getElementById("sequence-lanes");
    const buildVolumesButton = document.getElementById("build-volumes");
    const volumeStatus = document.getElementById("volume-status");
    const crosslinkTab = document.getElementById("crosslink-tab");
    const mprTab = document.getElementById("mpr-tab");
    const crosslinkWorkspace = document.getElementById("crosslink-workspace");
    const mprWorkspace = document.getElementById("mpr-workspace");
    const axialViewports = document.getElementById("axial-viewports");
    const anchorTarget = document.getElementById("anchor-target");
    const addAnchorButton = document.getElementById("add-anchor");
    const updateAnchorButton = document.getElementById("update-anchor");
    const deleteAnchorButton = document.getElementById("delete-anchor");
    const anchorMessage = document.getElementById("anchor-message");
    const anchorConnectors = document.getElementById("anchor-connectors");
    const crosslinkTimelines = document.getElementById("crosslink-timelines");
    const syncNavigationControl = document.getElementById("sync-navigation");
    const syncIntensityControl = document.getElementById("sync-intensity");
    const fitViewButton = document.getElementById("fit-view");
    const resetViewButton = document.getElementById("reset-view");
    const invertViewButton = document.getElementById("invert-view");
    const geometryWarning = document.getElementById("geometry-warning");
    const primaryMprGrid = document.getElementById("primary-mpr-grid");
    const secondaryMprRegions = document.getElementById("secondary-mpr-regions");
    const obliqueAzimuth = document.getElementById("oblique-azimuth");
    const obliqueTilt = document.getElementById("oblique-tilt");
    const obliqueRoll = document.getElementById("oblique-roll");
    const obliqueReset = document.getElementById("oblique-reset");
    const dropTarget = document.querySelector(".file-button");
    const state = {
      items: [],
      boundaries: [],
      geometry: new Map(),
      volumes: new Map(),
      crosslinks: Core.createCrosslinkMaps(2),
      positions: { 1: 0, 2: 0 },
      crosshairs: new Map(),
      viewportStates: new Map(),
      viewports: new Map(),
      selectedViewport: "",
      renderMeta: new Map(),
      obliqueAngles: { azimuth: 0, tilt: 0, roll: 0 },
      selectedAnchor: null,
      nextItemId: 1
    };

    function sequenceCount() {
      return Number(sequenceCountControl.value);
    }

    function activeSequenceIds() {
      return Array.from({ length: sequenceCount() }, function (_, index) { return index + 1; });
    }

    function defaultBoundaries(itemCount) {
      return Array.from({ length: sequenceCount() - 1 }, function (_, index) {
        return Math.round(itemCount * (index + 1) / sequenceCount());
      });
    }

    function geometryFor(sequenceId) {
      if (!state.geometry.has(sequenceId)) {
        state.geometry.set(sequenceId, Core.normalizeGeometry({}));
      }
      return state.geometry.get(sequenceId);
    }

    function setStatus(message, isError) {
      volumeStatus.textContent = message;
      volumeStatus.style.color = isError ? "var(--danger)" : "var(--muted)";
    }

    function isSupportedImage(file) {
      return /\.(png|jpe?g)$/i.test(file.name)
        && (!file.type || file.type === "image/png" || file.type === "image/jpeg");
    }

    function loadRenderable(file) {
      if (typeof createImageBitmap === "function") {
        return createImageBitmap(file).then(function (bitmap) {
          return {
            source: bitmap,
            width: bitmap.width,
            height: bitmap.height,
            release: function () { bitmap.close(); }
          };
        });
      }
      return new Promise(function (resolve, reject) {
        const objectUrl = URL.createObjectURL(file);
        const image = new Image();
        image.onload = function () {
          resolve({
            source: image,
            width: image.naturalWidth,
            height: image.naturalHeight,
            release: function () { URL.revokeObjectURL(objectUrl); }
          });
        };
        image.onerror = function () {
          URL.revokeObjectURL(objectUrl);
          reject(new Error("影像解碼失敗"));
        };
        image.src = objectUrl;
      });
    }

    async function createThumbnail(item) {
      let renderable;
      try {
        renderable = await loadRenderable(item.file);
        const longest = Math.max(renderable.width, renderable.height);
        const scale = Math.min(1, 96 / Math.max(1, longest));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(renderable.width * scale));
        canvas.height = Math.max(1, Math.round(renderable.height * scale));
        const context = canvas.getContext("2d", { alpha: false });
        context.drawImage(renderable.source, 0, 0, canvas.width, canvas.height);
        return Object.assign({}, item, {
          thumbnailUrl: canvas.toDataURL("image/jpeg", 0.72),
          width: renderable.width,
          height: renderable.height,
          decodeError: ""
        });
      } catch (error) {
        return Object.assign({}, item, {
          thumbnailUrl: "",
          width: 0,
          height: 0,
          decodeError: error instanceof Error ? error.message : String(error)
        });
      } finally {
        if (renderable) renderable.release();
      }
    }

    async function handleFiles(fileList) {
      const accepted = Array.from(fileList).filter(isSupportedImage).map(function (file, originalIndex) {
        return {
          id: `image-${state.nextItemId + originalIndex}`,
          name: file.name,
          file,
          originalIndex,
          included: true
        };
      });
      state.nextItemId += accepted.length;
      accepted.sort(function (left, right) {
        return Core.naturalCompare(left.name, right.name) || left.originalIndex - right.originalIndex;
      });
      status.textContent = accepted.length ? `正在建立 ${accepted.length} 張本機縮圖` : "未找到 PNG 或 JPG";
      const decoded = [];
      for (const item of accepted) {
        decoded.push(await createThumbnail(item));
        status.textContent = `縮圖 ${decoded.length} / ${accepted.length}`;
      }
      state.boundaries = defaultBoundaries(decoded.length);
      state.items = Core.assignByBoundaries(decoded, sequenceCount(), state.boundaries);
      state.volumes.clear();
      status.textContent = accepted.length ? `已載入 ${accepted.length} 張影像，尚未建立 volume` : "尚未載入影像";
      buildVolumesButton.disabled = accepted.length === 0;
      renderOrganizer();
    }

    function applyBoundaries() {
      state.items = Core.assignByBoundaries(state.items, sequenceCount(), state.boundaries);
      state.volumes.clear();
      renderOrganizer();
    }

    function renderBoundaryControls() {
      boundaryControls.replaceChildren();
      if (!state.items.length) {
        const empty = document.createElement("div");
        empty.className = "status";
        empty.textContent = "載入後顯示可拖曳分界。";
        boundaryControls.appendChild(empty);
        return;
      }
      state.boundaries.forEach(function (boundary, boundaryIndex) {
        const row = document.createElement("label");
        row.className = "boundary-row";
        const title = document.createElement("span");
        title.textContent = `分界 ${boundaryIndex + 1}`;
        const range = document.createElement("input");
        range.type = "range";
        range.min = "0";
        range.max = String(state.items.length);
        range.step = "1";
        range.value = String(boundary);
        const value = document.createElement("output");
        value.textContent = String(boundary);
        range.addEventListener("input", function () {
          const next = Number(range.value);
          const lower = boundaryIndex ? state.boundaries[boundaryIndex - 1] : 0;
          const upper = boundaryIndex + 1 < state.boundaries.length
            ? state.boundaries[boundaryIndex + 1]
            : state.items.length;
          state.boundaries[boundaryIndex] = Math.max(lower, Math.min(upper, next));
          value.textContent = String(state.boundaries[boundaryIndex]);
          applyBoundaries();
        });
        row.append(title, range, value);
        boundaryControls.appendChild(row);
      });
    }

    function makeGeometryControl(labelText, control) {
      const label = document.createElement("label");
      label.textContent = labelText;
      label.appendChild(control);
      return label;
    }

    function updateGeometryFromLane(lane, sequenceId) {
      const previous = geometryFor(sequenceId);
      const value = function (name) { return lane.querySelector(`[data-geometry="${name}"]`); };
      state.geometry.set(sequenceId, Core.normalizeGeometry({
        pixelSpacingX: value("pixelSpacingX").value,
        pixelSpacingY: value("pixelSpacingY").value,
        sliceSpacing: value("sliceSpacing").value,
        order: value("order").value,
        rotation: value("rotation").value,
        flipX: value("flipX").checked,
        flipY: value("flipY").checked,
        unknownScale: previous.unknownScale && value("pixelSpacingX").value === "1" && value("pixelSpacingY").value === "1"
      }));
      state.volumes.delete(sequenceId);
    }

    function buildGeometryGrid(sequenceId, lane) {
      const geometry = geometryFor(sequenceId);
      const grid = document.createElement("div");
      grid.className = "geometry-grid";
      const order = document.createElement("select");
      order.dataset.geometry = "order";
      [["forward", "正向"], ["reverse", "反向"]].forEach(function (entry) {
        const option = document.createElement("option");
        option.value = entry[0];
        option.textContent = entry[1];
        option.selected = geometry.order === entry[0];
        order.appendChild(option);
      });
      const rotation = document.createElement("select");
      rotation.dataset.geometry = "rotation";
      [0, 90, 180, 270].forEach(function (angle) {
        const option = document.createElement("option");
        option.value = String(angle);
        option.textContent = `${angle}°`;
        option.selected = geometry.rotation === angle;
        rotation.appendChild(option);
      });
      const spacingInput = function (name, value) {
        const control = document.createElement("input");
        control.type = "number";
        control.min = "0.01";
        control.step = "0.01";
        control.value = String(value);
        control.dataset.geometry = name;
        return control;
      };
      const flipInput = function (name, checked) {
        const control = document.createElement("input");
        control.type = "checkbox";
        control.checked = checked;
        control.dataset.geometry = name;
        return control;
      };
      const flipX = makeGeometryControl("左右翻轉", flipInput("flipX", geometry.flipX));
      const flipY = makeGeometryControl("上下翻轉", flipInput("flipY", geometry.flipY));
      flipX.className = "check-row";
      flipY.className = "check-row";
      grid.append(
        makeGeometryControl("切片順序", order),
        makeGeometryControl("旋轉", rotation),
        makeGeometryControl("X mm/px", spacingInput("pixelSpacingX", geometry.pixelSpacingX)),
        makeGeometryControl("Y mm/px", spacingInput("pixelSpacingY", geometry.pixelSpacingY)),
        makeGeometryControl("切片間距 mm", spacingInput("sliceSpacing", geometry.sliceSpacing)),
        flipX,
        flipY
      );
      grid.addEventListener("change", function () { updateGeometryFromLane(lane, sequenceId); });
      return grid;
    }

    function renderLane(sequenceId) {
      const lane = document.createElement("section");
      lane.className = "sequence-lane";
      lane.dataset.sequenceId = String(sequenceId);
      const items = state.items.filter(function (item) { return item.sequenceId === sequenceId; });
      const title = document.createElement("div");
      title.className = "lane-title";
      title.innerHTML = `<strong>Sequence ${sequenceId}</strong><span>${items.filter(function (item) { return item.included; }).length} / ${items.length} 張</span>`;
      const strip = document.createElement("div");
      strip.className = "thumbnail-strip";
      items.forEach(function (item) {
        const card = document.createElement("article");
        card.className = `thumbnail-card${item.included ? "" : " excluded"}${item.decodeError ? " failed" : ""}`;
        card.draggable = true;
        card.dataset.itemId = item.id;
        card.title = item.decodeError ? `${item.name}: ${item.decodeError}` : item.name;
        card.addEventListener("dragstart", function (event) {
          event.dataTransfer.setData("text/plain", item.id);
        });
        if (item.thumbnailUrl) {
          const image = document.createElement("img");
          image.src = item.thumbnailUrl;
          image.alt = item.name;
          card.appendChild(image);
        }
        const name = document.createElement("div");
        name.className = "thumbnail-name";
        name.textContent = item.name;
        const actions = document.createElement("div");
        actions.className = "thumbnail-actions";
        const included = document.createElement("input");
        included.type = "checkbox";
        included.checked = item.included;
        included.title = "納入 volume";
        included.addEventListener("change", function () {
          state.items = Core.setItemIncluded(state.items, item.id, included.checked);
          state.volumes.clear();
          renderOrganizer();
        });
        const target = document.createElement("select");
        activeSequenceIds().forEach(function (id) {
          const option = document.createElement("option");
          option.value = String(id);
          option.textContent = `S${id}`;
          option.selected = id === item.sequenceId;
          target.appendChild(option);
        });
        target.addEventListener("change", function () {
          state.items = Core.reassignItem(state.items, item.id, Number(target.value), sequenceCount());
          state.volumes.clear();
          renderOrganizer();
        });
        actions.append(included, target);
        card.append(name, actions);
        strip.appendChild(card);
      });
      lane.addEventListener("dragover", function (event) {
        event.preventDefault();
        lane.classList.add("drag-target");
      });
      lane.addEventListener("dragleave", function () { lane.classList.remove("drag-target"); });
      lane.addEventListener("drop", function (event) {
        event.preventDefault();
        lane.classList.remove("drag-target");
        const itemId = event.dataTransfer.getData("text/plain");
        state.items = Core.reassignItem(state.items, itemId, sequenceId, sequenceCount());
        state.volumes.clear();
        renderOrganizer();
      });
      lane.append(title, strip);
      lane.appendChild(buildGeometryGrid(sequenceId, lane));
      return lane;
    }

    function renderOrganizer() {
      renderBoundaryControls();
      sequenceLanes.replaceChildren();
      activeSequenceIds().forEach(function (sequenceId) {
        sequenceLanes.appendChild(renderLane(sequenceId));
      });
    }

    async function decodeLuminance(file) {
      let renderable;
      try {
        renderable = await loadRenderable(file);
        const canvas = document.createElement("canvas");
        canvas.width = renderable.width;
        canvas.height = renderable.height;
        const context = canvas.getContext("2d", { alpha: false, willReadFrequently: true });
        context.drawImage(renderable.source, 0, 0);
        const rgba = context.getImageData(0, 0, canvas.width, canvas.height).data;
        const luminance = new Uint8Array(canvas.width * canvas.height);
        for (let index = 0; index < luminance.length; index += 1) {
          const offset = index * 4;
          luminance[index] = (77 * rgba[offset] + 150 * rgba[offset + 1] + 29 * rgba[offset + 2]) >> 8;
        }
        return { width: canvas.width, height: canvas.height, data: luminance };
      } finally {
        if (renderable) renderable.release();
      }
    }

    function includedItems(sequenceId) {
      return state.items.filter(function (item) {
        return item.sequenceId === sequenceId && item.included && !item.decodeError;
      }).sort(function (left, right) { return left.sortIndex - right.sortIndex; });
    }

    async function constructVolume(sequenceId, geometry, validation) {
      const items = includedItems(sequenceId);
      const sliceNames = Core.canonicalSliceNames(items, geometry);
      const allocation = Core.allocateVolume({
        sequenceId,
        width: validation.width,
        height: validation.height,
        depth: validation.depth
      });
      if (!allocation.ok) throw new Error(`Sequence ${sequenceId}: ${allocation.error}`);
      for (let canonicalZ = 0; canonicalZ < validation.depth; canonicalZ += 1) {
        const sourceZ = Core.canonicalToSource(
          0, 0, canonicalZ, items[0].width, items[0].height, validation.depth, geometry
        ).z;
        const decoded = await decodeLuminance(items[sourceZ].file);
        if (decoded.width !== items[0].width || decoded.height !== items[0].height) {
          throw new Error(`${items[sourceZ].name}: 解碼後尺寸已變更`);
        }
        for (let canonicalY = 0; canonicalY < validation.height; canonicalY += 1) {
          for (let canonicalX = 0; canonicalX < validation.width; canonicalX += 1) {
            const source = Core.canonicalToSource(
              canonicalX,
              canonicalY,
              canonicalZ,
              decoded.width,
              decoded.height,
              validation.depth,
              geometry
            );
            const targetOffset = canonicalZ * validation.width * validation.height
              + canonicalY * validation.width + canonicalX;
            allocation.data[targetOffset] = decoded.data[source.y * decoded.width + source.x];
          }
        }
        setStatus(`Sequence ${sequenceId}: ${canonicalZ + 1} / ${validation.depth}`, false);
      }
      return {
        id: sequenceId,
        data: allocation.data,
        width: validation.width,
        height: validation.height,
        depth: validation.depth,
        pixelSpacingX: geometry.pixelSpacingX,
        pixelSpacingY: geometry.pixelSpacingY,
        sliceSpacing: geometry.sliceSpacing,
        sliceNames,
        geometry
      };
    }

    async function buildVolumes() {
      buildVolumesButton.disabled = true;
      const plans = [];
      try {
        for (const sequenceId of activeSequenceIds()) {
          const geometry = geometryFor(sequenceId);
          const entries = state.items.filter(function (item) {
            return item.sequenceId === sequenceId && item.included;
          }).map(function (item) {
            return {
              name: item.name,
              width: item.width,
              height: item.height,
              ok: !item.decodeError,
              error: item.decodeError
            };
          });
          const validation = Core.validateDecodedSequence(entries, geometry);
          if (!validation.valid) throw new Error(`Sequence ${sequenceId}: ${validation.errors.join("；")}`);
          plans.push({ sequenceId, geometry, validation });
        }
        const bytes = Core.estimateVolumeBytes(plans.map(function (plan) { return plan.validation; }));
        if (Core.requiresMemoryConfirmation(bytes)) {
          const mebibytes = (bytes / (1024 * 1024)).toFixed(1);
          if (!confirm(`預估需要 ${mebibytes} MiB 灰階記憶體。仍要建立嗎？`)) {
            setStatus("已取消大型 volume 配置；編排仍保留。", false);
            return;
          }
        }
        const nextVolumes = new Map();
        for (const plan of plans) {
          nextVolumes.set(
            plan.sequenceId,
            await constructVolume(plan.sequenceId, plan.geometry, plan.validation)
          );
        }
        state.volumes = nextVolumes;
        setStatus(`已建立 ${state.volumes.size} 組本機 volumes`, false);
        renderWorkspaceShells();
      } catch (error) {
        setStatus(error instanceof Error ? error.message : String(error), true);
      } finally {
        buildVolumesButton.disabled = state.items.length === 0;
      }
    }

    function depthMap() {
      const depths = {};
      state.volumes.forEach(function (volume, sequenceId) { depths[sequenceId] = volume.depth; });
      return depths;
    }

    function renderAnchorTargetOptions() {
      const previous = Number(anchorTarget.value) || 2;
      anchorTarget.replaceChildren();
      activeSequenceIds().filter(function (sequenceId) { return sequenceId > 1; }).forEach(function (sequenceId) {
        const option = document.createElement("option");
        option.value = String(sequenceId);
        option.textContent = `Sequence ${sequenceId}`;
        option.selected = sequenceId === previous;
        anchorTarget.appendChild(option);
      });
    }

    function markerPercent(position, depth) {
      return depth > 1 ? 100 * Number(position) / (depth - 1) : 0;
    }

    function selectAnchor(targetId, anchorIndex) {
      state.selectedAnchor = { targetId: Number(targetId), index: Number(anchorIndex) };
      anchorTarget.value = String(targetId);
      renderTimelines();
    }

    function createAnchorMarker(sequenceId, targetId, anchorIndex, position, depth) {
      const marker = document.createElement("button");
      marker.type = "button";
      marker.className = "anchor-marker";
      if (state.selectedAnchor
          && state.selectedAnchor.targetId === targetId
          && state.selectedAnchor.index === anchorIndex) marker.classList.add("selected");
      marker.style.left = `${markerPercent(position, depth)}%`;
      marker.dataset.sequenceId = String(sequenceId);
      marker.dataset.targetId = String(targetId);
      marker.dataset.anchorIndex = String(anchorIndex);
      marker.title = `S1 ${state.crosslinks[targetId][anchorIndex].referenceIndex} ↔ S${targetId} ${state.crosslinks[targetId][anchorIndex].targetIndex}`;
      marker.addEventListener("click", function () { selectAnchor(targetId, anchorIndex); });
      return marker;
    }

    function drawAnchorConnectors() {
      const stage = anchorConnectors.parentElement.getBoundingClientRect();
      const lines = [];
      Object.keys(state.crosslinks).map(Number).forEach(function (targetId) {
        state.crosslinks[targetId].forEach(function (_, anchorIndex) {
          const reference = crosslinkTimelines.querySelector(`[data-sequence-id="1"][data-target-id="${targetId}"][data-anchor-index="${anchorIndex}"]`);
          const target = crosslinkTimelines.querySelector(`[data-sequence-id="${targetId}"][data-target-id="${targetId}"][data-anchor-index="${anchorIndex}"]`);
          if (!reference || !target) return;
          const first = reference.getBoundingClientRect();
          const second = target.getBoundingClientRect();
          const x1 = first.left + first.width / 2 - stage.left;
          const y1 = first.top + first.height / 2 - stage.top;
          const x2 = second.left + second.width / 2 - stage.left;
          const y2 = second.top + second.height / 2 - stage.top;
          lines.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f0ae4b" stroke-width="1.5" opacity="0.8"/>`);
        });
      });
      anchorConnectors.innerHTML = lines.join("");
    }

    function renderTimelines() {
      crosslinkTimelines.replaceChildren();
      const depths = depthMap();
      activeSequenceIds().forEach(function (sequenceId) {
        const row = document.createElement("div");
        row.className = "timeline-row";
        const label = document.createElement("span");
        label.className = "timeline-label";
        const position = state.positions[sequenceId] || 0;
        label.textContent = `Sequence ${sequenceId} · ${Math.round(position) + 1}`;
        const track = document.createElement("div");
        track.className = "timeline-track";
        if (sequenceId === 1) {
          Object.keys(state.crosslinks).map(Number).forEach(function (targetId) {
            state.crosslinks[targetId].forEach(function (anchor, anchorIndex) {
              track.appendChild(createAnchorMarker(1, targetId, anchorIndex, anchor.referenceIndex, depths[1] || 1));
            });
          });
        } else {
          (state.crosslinks[sequenceId] || []).forEach(function (anchor, anchorIndex) {
            track.appendChild(createAnchorMarker(sequenceId, sequenceId, anchorIndex, anchor.targetIndex, depths[sequenceId] || 1));
          });
        }
        row.append(label, track);
        crosslinkTimelines.appendChild(row);
      });
      updateAnchorButtons();
      requestAnimationFrame(drawAnchorConnectors);
    }

    function updateAnchorButtons() {
      const selected = state.selectedAnchor !== null;
      updateAnchorButton.disabled = !selected;
      deleteAnchorButton.disabled = !selected;
      if (!selected) {
        anchorMessage.textContent = "目前切片尚未配對。";
        return;
      }
      const selectedAnchor = state.crosslinks[state.selectedAnchor.targetId][state.selectedAnchor.index];
      anchorMessage.textContent = `所選：S1 ${selectedAnchor.referenceIndex + 1} ↔ S${state.selectedAnchor.targetId} ${selectedAnchor.targetIndex + 1}`;
    }

    function currentAnchorCandidate(targetId) {
      return {
        referenceIndex: Number(state.positions[1] || 0),
        targetIndex: Number(state.positions[targetId] || 0)
      };
    }

    function saveAnchor(editExisting) {
      const targetId = Number(anchorTarget.value);
      const editIndex = editExisting && state.selectedAnchor ? state.selectedAnchor.index : undefined;
      const result = Core.upsertAnchor(
        state.crosslinks[targetId] || [],
        currentAnchorCandidate(targetId),
        editIndex
      );
      if (!result.valid) {
        anchorMessage.textContent = result.reason;
        anchorMessage.style.color = "var(--danger)";
        return;
      }
      state.crosslinks[targetId] = result.anchors;
      const candidate = currentAnchorCandidate(targetId);
      state.selectedAnchor = {
        targetId,
        index: result.anchors.findIndex(function (anchor) {
          return anchor.referenceIndex === candidate.referenceIndex && anchor.targetIndex === candidate.targetIndex;
        })
      };
      anchorMessage.style.color = "var(--muted)";
      renderTimelines();
    }

    function removeSelectedAnchor() {
      if (!state.selectedAnchor) return;
      const targetId = state.selectedAnchor.targetId;
      state.crosslinks[targetId] = Core.deleteAnchor(state.crosslinks[targetId], state.selectedAnchor.index);
      state.selectedAnchor = null;
      renderTimelines();
    }

    function resetCrosslinkState() {
      state.crosslinks = Core.createCrosslinkMaps(sequenceCount());
      state.positions = {};
      activeSequenceIds().forEach(function (sequenceId) { state.positions[sequenceId] = 0; });
      state.selectedAnchor = null;
      renderAnchorTargetOptions();
    }

    function viewportState(key) {
      if (!state.viewportStates.has(key)) {
        state.viewportStates.set(key, {
          zoom: 1,
          panX: 0,
          panY: 0,
          intensityWidth: 255,
          intensityCenter: 127.5,
          invert: false
        });
      }
      return state.viewportStates.get(key);
    }

    function crosshairFor(sequenceId) {
      const volume = state.volumes.get(sequenceId);
      if (!volume) return { x: 0, y: 0, z: 0 };
      if (!state.crosshairs.has(sequenceId)) {
        state.crosshairs.set(sequenceId, {
          x: (volume.width - 1) / 2,
          y: (volume.height - 1) / 2,
          z: Number(state.positions[sequenceId] || 0)
        });
      }
      const crosshair = state.crosshairs.get(sequenceId);
      crosshair.z = Number(state.positions[sequenceId] || 0);
      return crosshair;
    }

    function selectViewport(key) {
      state.selectedViewport = key;
      state.viewports.forEach(function (viewport) {
        viewport.card.classList.toggle("selected", viewport.key === key);
      });
    }

    function physicalPlaneSize(volume, kind) {
      if (kind === "COR") {
        return { width: volume.width * volume.pixelSpacingX, height: volume.depth * volume.sliceSpacing };
      }
      if (kind === "SAG") {
        return { width: volume.height * volume.pixelSpacingY, height: volume.depth * volume.sliceSpacing };
      }
      if (kind === "OBLIQUE") {
        const diagonal = Math.hypot(
          volume.width * volume.pixelSpacingX,
          volume.height * volume.pixelSpacingY,
          volume.depth * volume.sliceSpacing
        );
        return { width: diagonal, height: diagonal };
      }
      return { width: volume.width * volume.pixelSpacingX, height: volume.height * volume.pixelSpacingY };
    }

    function planeForViewport(viewport, outputWidth, outputHeight) {
      const volume = state.volumes.get(viewport.sequenceId);
      const viewState = viewportState(viewport.key);
      const crosshair = crosshairFor(viewport.sequenceId);
      const center = { x: crosshair.x, y: crosshair.y, z: crosshair.z };
      if (viewport.crosslinkAxial) center.z = Math.round(center.z);
      let plane = viewport.kind === "OBLIQUE"
        ? Core.makeObliquePlane(volume, center, state.obliqueAngles)
        : Core.makeOrthogonalPlane(viewport.kind, volume, center);
      const size = physicalPlaneSize(volume, viewport.kind);
      const millimetresPerPixel = Math.max(
        size.width / Math.max(1, outputWidth),
        size.height / Math.max(1, outputHeight)
      ) / viewState.zoom;
      plane.mmPerPixelX = millimetresPerPixel;
      plane.mmPerPixelY = millimetresPerPixel;
      plane.center = {
        x: plane.center.x + (plane.u.x * viewState.panX + plane.v.x * viewState.panY) / volume.pixelSpacingX,
        y: plane.center.y + (plane.u.y * viewState.panX + plane.v.y * viewState.panY) / volume.pixelSpacingY,
        z: plane.center.z + (plane.u.z * viewState.panX + plane.v.z * viewState.panY) / volume.sliceSpacing
      };
      plane.intensity = {
        width: viewState.intensityWidth,
        center: viewState.intensityCenter,
        invert: viewState.invert
      };
      return plane;
    }

    function renderViewportNow(viewport, size, generation) {
      const meta = state.renderMeta.get(viewport.key);
      if (!meta || !Core.isRenderGenerationCurrent(generation, meta.generation)) return;
      const volume = state.volumes.get(viewport.sequenceId);
      if (!volume) return;
      const plane = planeForViewport(viewport, size.width, size.height);
      const pixels = Core.reslicePlane(volume, plane, size.width, size.height);
      if (!Core.isRenderGenerationCurrent(generation, state.renderMeta.get(viewport.key).generation)) return;
      const canvas = viewport.canvas;
      canvas.width = size.width;
      canvas.height = size.height;
      const context = canvas.getContext("2d", { alpha: false });
      context.putImageData(new ImageData(pixels, size.width, size.height), 0, 0);
      context.save();
      context.strokeStyle = "rgba(69, 199, 184, .75)";
      context.lineWidth = Math.max(1, size.width / 500);
      context.beginPath();
      context.moveTo(size.width / 2, size.height * 0.42);
      context.lineTo(size.width / 2, size.height * 0.58);
      context.moveTo(size.width * 0.42, size.height / 2);
      context.lineTo(size.width * 0.58, size.height / 2);
      context.stroke();
      context.fillStyle = "#e9faf7";
      context.font = `${Math.max(10, Math.round(size.width / 34))}px system-ui`;
      context.fillText(plane.labels.left, 6, size.height / 2);
      context.fillText(plane.labels.right, size.width - 18, size.height / 2);
      context.fillText(plane.labels.top, size.width / 2, 14);
      context.fillText(plane.labels.bottom, size.width / 2, size.height - 6);
      context.restore();
      const viewState = viewportState(viewport.key);
      viewport.hud.lastElementChild.textContent = `${viewport.kind} · slice ${Math.round(state.positions[viewport.sequenceId]) + 1}/${volume.depth} · Z ${viewState.zoom.toFixed(2)}×`;
      updateViewportFilename(viewport);
    }

    function updateViewportFilename(viewport) {
      if (!viewport.filename) return;
      const volume = state.volumes.get(viewport.sequenceId);
      const name = volume
        ? Core.sliceNameAtPosition(volume.sliceNames || [], state.positions[viewport.sequenceId])
        : "";
      viewport.filename.textContent = name ? `檔案：${name}` : "檔案：—";
      viewport.filename.title = name;
    }

    function scheduleViewportRender(viewport, interactive) {
      const previous = state.renderMeta.get(viewport.key) || { generation: 0, timer: 0 };
      if (previous.timer) clearTimeout(previous.timer);
      const generation = previous.generation + 1;
      const rect = viewport.canvas.getBoundingClientRect();
      const plan = Core.progressiveRenderPlan(
        rect.width || 320,
        rect.height || 240,
        globalThis.devicePixelRatio || 1,
        generation
      );
      const meta = { generation, timer: 0 };
      state.renderMeta.set(viewport.key, meta);
      renderViewportNow(viewport, interactive ? plan.preview : plan.full, generation);
      if (interactive) {
        meta.timer = setTimeout(function () {
          if (Core.isRenderGenerationCurrent(generation, state.renderMeta.get(viewport.key).generation)) {
            renderViewportNow(viewport, plan.full, generation);
          }
        }, plan.delayMs);
      }
    }

    function renderAllViewports(interactive) {
      state.viewports.forEach(function (viewport) { scheduleViewportRender(viewport, interactive); });
      renderTimelines();
    }

    function copyNavigation(sourceState) {
      if (!syncNavigationControl.checked) return;
      state.viewportStates.forEach(function (targetState) {
        targetState.zoom = sourceState.zoom;
        targetState.panX = sourceState.panX;
        targetState.panY = sourceState.panY;
      });
    }

    function copyIntensity(sourceState) {
      if (!syncIntensityControl.checked) return;
      state.viewportStates.forEach(function (targetState) {
        targetState.intensityWidth = sourceState.intensityWidth;
        targetState.intensityCenter = sourceState.intensityCenter;
        targetState.invert = sourceState.invert;
      });
    }

    function updateSynchronizedPosition(sequenceId, position) {
      state.positions = Core.synchronizePositions(
        sequenceId,
        position,
        state.crosslinks,
        depthMap(),
        state.positions
      );
      Object.keys(state.positions).map(Number).forEach(function (id) {
        if (state.crosshairs.has(id)) state.crosshairs.get(id).z = state.positions[id];
      });
      renderAllViewports(true);
    }

    function updateObliqueInputs() {
      obliqueAzimuth.value = String(Math.round(state.obliqueAngles.azimuth * 10) / 10);
      obliqueTilt.value = String(Math.round(state.obliqueAngles.tilt * 10) / 10);
      obliqueRoll.value = String(Math.round(state.obliqueAngles.roll * 10) / 10);
    }

    function bindViewportInteractions(viewport) {
      const canvas = viewport.canvas;
      let drag = null;
      canvas.addEventListener("wheel", function (event) {
        event.preventDefault();
        selectViewport(viewport.key);
        const viewState = viewportState(viewport.key);
        if (event.ctrlKey || event.metaKey) {
          viewState.zoom = Math.max(0.25, Math.min(12, viewState.zoom * (event.deltaY > 0 ? 0.9 : 1.1)));
          copyNavigation(viewState);
          renderAllViewports(true);
        } else {
          updateSynchronizedPosition(
            viewport.sequenceId,
            Number(state.positions[viewport.sequenceId]) + (event.deltaY > 0 ? 1 : -1)
          );
        }
      }, { passive: false });
      canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });
      canvas.addEventListener("pointerdown", function (event) {
        event.preventDefault();
        selectViewport(viewport.key);
        let mode = "crosshair";
        if (event.button === 2) mode = "intensity";
        else if (viewport.kind === "OBLIQUE" && event.altKey) mode = "oblique";
        else if (event.button === 1 || event.shiftKey) mode = "pan";
        drag = { mode, x: event.clientX, y: event.clientY, shift: event.shiftKey };
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener("pointermove", function (event) {
        if (!drag) return;
        const dx = event.clientX - drag.x;
        const dy = event.clientY - drag.y;
        drag.x = event.clientX;
        drag.y = event.clientY;
        const viewState = viewportState(viewport.key);
        if (drag.mode === "intensity") {
          viewState.intensityWidth = Math.max(1, Math.min(510, viewState.intensityWidth + dx * 1.5));
          viewState.intensityCenter = Math.max(-127.5, Math.min(382.5, viewState.intensityCenter - dy));
          copyIntensity(viewState);
        } else if (drag.mode === "pan") {
          viewState.panX -= dx / viewState.zoom;
          viewState.panY -= dy / viewState.zoom;
          copyNavigation(viewState);
        } else if (drag.mode === "oblique") {
          if (drag.shift) state.obliqueAngles.roll += dx * 0.5;
          else {
            state.obliqueAngles.azimuth += dx * 0.5;
            state.obliqueAngles.tilt = Math.max(-90, Math.min(90, state.obliqueAngles.tilt + dy * 0.5));
          }
          updateObliqueInputs();
        } else {
          const volume = state.volumes.get(viewport.sequenceId);
          const bounds = canvas.getBoundingClientRect();
          const horizontal = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
          const vertical = Math.max(0, Math.min(1, (event.clientY - bounds.top) / bounds.height));
          const crosshair = crosshairFor(viewport.sequenceId);
          if (viewport.kind === "AX" || viewport.kind === "OBLIQUE") {
            crosshair.x = horizontal * (volume.width - 1);
            crosshair.y = vertical * (volume.height - 1);
          } else if (viewport.kind === "COR") {
            crosshair.x = horizontal * (volume.width - 1);
            updateSynchronizedPosition(viewport.sequenceId, vertical * (volume.depth - 1));
            return;
          } else if (viewport.kind === "SAG") {
            crosshair.y = horizontal * (volume.height - 1);
            updateSynchronizedPosition(viewport.sequenceId, vertical * (volume.depth - 1));
            return;
          }
        }
        renderAllViewports(true);
      });
      const finishDrag = function (event) {
        if (!drag) return;
        drag = null;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        renderAllViewports(false);
      };
      canvas.addEventListener("pointerup", finishDrag);
      canvas.addEventListener("pointercancel", finishDrag);
    }

    function createViewport(sequenceId, kind, key, crosslinkAxial) {
      const card = document.createElement("article");
      card.className = "viewport-card";
      card.dataset.viewportKey = key;
      const canvas = document.createElement("canvas");
      canvas.setAttribute("aria-label", `Sequence ${sequenceId} ${kind} viewport`);
      const hud = document.createElement("div");
      hud.className = "viewport-hud";
      const sequenceLabel = document.createElement("span");
      sequenceLabel.textContent = `Sequence ${sequenceId}`;
      const detail = document.createElement("span");
      hud.append(sequenceLabel, detail);
      card.append(canvas, hud);
      let root = card;
      let filename = null;
      if (crosslinkAxial) {
        root = document.createElement("div");
        root.className = "viewport-stack";
        filename = document.createElement("div");
        filename.className = "viewport-filename";
        root.append(card, filename);
      }
      const viewport = {
        key,
        sequenceId,
        kind,
        crosslinkAxial: Boolean(crosslinkAxial),
        root,
        card,
        canvas,
        hud,
        filename
      };
      state.viewports.set(key, viewport);
      viewportState(key);
      bindViewportInteractions(viewport);
      card.addEventListener("pointerdown", function () { selectViewport(key); });
      return root;
    }

    function buildViewportWorkspace() {
      state.renderMeta.forEach(function (meta) { if (meta.timer) clearTimeout(meta.timer); });
      state.renderMeta.clear();
      state.viewports.clear();
      axialViewports.className = "viewport-grid";
      axialViewports.replaceChildren();
      activeSequenceIds().forEach(function (sequenceId) {
        axialViewports.appendChild(createViewport(sequenceId, "AX", `cross-${sequenceId}-ax`, true));
      });
      primaryMprGrid.replaceChildren();
      ["AX", "COR", "SAG", "OBLIQUE"].forEach(function (kind) {
        primaryMprGrid.appendChild(createViewport(1, kind, `mpr-1-${kind.toLowerCase()}`, false));
      });
      secondaryMprRegions.replaceChildren();
      activeSequenceIds().filter(function (sequenceId) { return sequenceId > 1; }).forEach(function (sequenceId) {
        const region = document.createElement("section");
        region.className = "mpr-region";
        const heading = document.createElement("h2");
        heading.textContent = `Sequence ${sequenceId} · 同步比較`;
        const grid = document.createElement("div");
        grid.className = "secondary-grid";
        ["AX", "COR", "SAG", "OBLIQUE"].forEach(function (kind) {
          grid.appendChild(createViewport(sequenceId, kind, `mpr-${sequenceId}-${kind.toLowerCase()}`, false));
        });
        region.append(heading, grid);
        secondaryMprRegions.appendChild(region);
      });
      const firstKey = state.viewports.keys().next().value;
      if (firstKey) selectViewport(firstKey);
      geometryWarning.classList.toggle("visible", Array.from(state.volumes.values()).some(function (volume) {
        return volume.geometry.unknownScale;
      }));
    }

    function tryCreateRenderWorker() {
      try {
        const source = "self.onmessage=function(event){self.postMessage(event.data);};";
        const objectUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
        const worker = new Worker(objectUrl);
        worker.terminate();
        URL.revokeObjectURL(objectUrl);
        return true;
      } catch (error) {
        return false;
      }
    }

    function renderWorkspaceShells() {
      if (!state.volumes.size) return;
      state.volumes.forEach(function (volume, sequenceId) {
        if (!Number.isFinite(state.positions[sequenceId])) state.positions[sequenceId] = (volume.depth - 1) / 2;
      });
      buildViewportWorkspace();
      tryCreateRenderWorker();
      renderAnchorTargetOptions();
      renderTimelines();
      requestAnimationFrame(function () { renderAllViewports(false); });
    }

    function setMode(mode) {
      const showMpr = mode === "mpr";
      crosslinkTab.setAttribute("aria-selected", String(!showMpr));
      mprTab.setAttribute("aria-selected", String(showMpr));
      crosslinkWorkspace.hidden = showMpr;
      mprWorkspace.hidden = !showMpr;
      requestAnimationFrame(function () { renderAllViewports(false); });
    }

    function selectedViewportState() {
      return state.selectedViewport ? viewportState(state.selectedViewport) : null;
    }

    function fitSelectedViewport() {
      const viewState = selectedViewportState();
      if (!viewState) return;
      viewState.zoom = 1;
      viewState.panX = 0;
      viewState.panY = 0;
      copyNavigation(viewState);
      renderAllViewports(false);
    }

    function resetSelectedViewport() {
      const viewState = selectedViewportState();
      if (!viewState) return;
      viewState.zoom = 1;
      viewState.panX = 0;
      viewState.panY = 0;
      viewState.intensityWidth = 255;
      viewState.intensityCenter = 127.5;
      viewState.invert = false;
      copyNavigation(viewState);
      copyIntensity(viewState);
      renderAllViewports(false);
    }

    function updateObliqueFromControls() {
      state.obliqueAngles = {
        azimuth: Number(obliqueAzimuth.value) || 0,
        tilt: Math.max(-90, Math.min(90, Number(obliqueTilt.value) || 0)),
        roll: Number(obliqueRoll.value) || 0
      };
      renderAllViewports(true);
    }

    crosslinkTab.addEventListener("click", function () { setMode("crosslink"); });
    mprTab.addEventListener("click", function () { setMode("mpr"); });
    fitViewButton.addEventListener("click", fitSelectedViewport);
    resetViewButton.addEventListener("click", resetSelectedViewport);
    invertViewButton.addEventListener("click", function () {
      const viewState = selectedViewportState();
      if (!viewState) return;
      viewState.invert = !viewState.invert;
      copyIntensity(viewState);
      renderAllViewports(false);
    });
    [obliqueAzimuth, obliqueTilt, obliqueRoll].forEach(function (control) {
      control.addEventListener("input", updateObliqueFromControls);
    });
    obliqueReset.addEventListener("click", function () {
      state.obliqueAngles = { azimuth: 0, tilt: 0, roll: 0 };
      updateObliqueInputs();
      renderAllViewports(false);
    });
    addAnchorButton.addEventListener("click", function () { saveAnchor(false); });
    updateAnchorButton.addEventListener("click", function () { saveAnchor(true); });
    deleteAnchorButton.addEventListener("click", removeSelectedAnchor);
    anchorTarget.addEventListener("change", function () {
      state.selectedAnchor = null;
      updateAnchorButtons();
    });
    input.addEventListener("change", function () { handleFiles(input.files); });
    sequenceCountControl.addEventListener("change", function () {
      state.boundaries = defaultBoundaries(state.items.length);
      state.items = Core.assignByBoundaries(state.items, sequenceCount(), state.boundaries);
      activeSequenceIds().forEach(geometryFor);
      state.volumes.clear();
      resetCrosslinkState();
      renderOrganizer();
    });
    buildVolumesButton.addEventListener("click", buildVolumes);
    dropTarget.addEventListener("dragover", function (event) { event.preventDefault(); });
    dropTarget.addEventListener("drop", function (event) {
      event.preventDefault();
      if (event.dataTransfer && event.dataTransfer.files) handleFiles(event.dataTransfer.files);
    });
    globalThis.addEventListener("resize", function () { renderAllViewports(true); });
    activeSequenceIds().forEach(geometryFor);
    resetCrosslinkState();
    renderOrganizer();
  }());
  </script>
</body>
</html>
