<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline' blob:; worker-src blob:">
  <title>影像序列 Crosslink 與 MPR</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #081018;
      --panel: #101a25;
      --panel-2: #162333;
      --line: #2b4055;
      --text: #e6f1fb;
      --muted: #91a8bd;
      --accent: #45c7b8;
      --accent-2: #f0ae4b;
      --danger: #ef6a6a;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Microsoft JhengHei", sans-serif; }
    button, input, select { font: inherit; }
    button, select, input[type="number"] { border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--text); }
    button { min-height: 36px; padding: 7px 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    .app-shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    .topbar { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #0b151f; }
    .topbar h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
    .privacy { margin-left: auto; color: var(--accent); font-size: 13px; }
    .body { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
    .sidebar { min-width: 0; padding: 14px; overflow: visible; border-bottom: 1px solid var(--line); background: #0c1621; }
    .section { min-width: 0; padding: 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .section h2 { margin: 0 0 10px; font-size: 14px; }
    .field { display: grid; gap: 5px; margin: 9px 0; color: var(--muted); font-size: 12px; }
    .field select, .field input { width: 100%; min-height: 34px; padding: 5px 8px; }
    .file-button { display: grid; place-items: center; min-height: 72px; padding: 12px; border: 1px dashed var(--accent); border-radius: 10px; color: var(--accent); text-align: center; cursor: pointer; }
    .file-button input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .main { min-width: 0; overflow: visible; padding: 14px; }
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .mode-tabs button[aria-selected="true"] { color: #04110f; background: var(--accent); border-color: var(--accent); }
    .workspace { display: grid; gap: 12px; }
    .workspace[hidden] { display: none; }
    .empty-panel { min-height: 220px; display: grid; place-items: center; padding: 30px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); background: var(--panel); text-align: center; }
    #organizer { min-width: 0; min-height: 120px; display: grid; gap: 10px; }
    #sequence-lanes { min-width: 0; }
    .status { min-height: 20px; color: var(--muted); font-size: 12px; }
    .boundary-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) 42px; min-width: 0; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .boundary-row input { width: 100%; min-width: 0; max-width: 100%; margin: 0; }
    .sequence-lane { min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: #0b141e; }
    .sequence-lane.drag-target { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .lane-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; font-size: 12px; }
    .thumbnail-strip { display: grid; grid-auto-flow: column; grid-auto-columns: 82px; gap: 7px; width: 100%; min-width: 0; max-width: 100%; overflow-x: auto; padding-bottom: 5px; }
    .thumbnail-card { display: grid; gap: 4px; padding: 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font-size: 10px; }
    .thumbnail-card.excluded { opacity: .45; }
    .thumbnail-card.failed { border-color: var(--danger); }
    .thumbnail-card img { width: 70px; height: 56px; object-fit: contain; background: #000; }
    .thumbnail-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thumbnail-actions { display: grid; grid-template-columns: auto 1fr; gap: 3px; align-items: center; }
    .thumbnail-actions select { min-width: 0; width: 100%; font-size: 10px; }
    .geometry-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; margin-top: 7px; }
    .geometry-grid label { display: grid; gap: 2px; color: var(--muted); font-size: 10px; }
    .geometry-grid input, .geometry-grid select { width: 100%; min-width: 0; padding: 3px; }
    .check-row { display: flex !important; align-items: center; gap: 5px !important; }
    .primary-action { width: 100%; margin-top: 9px; color: #04110f; font-weight: 700; background: var(--accent); border-color: var(--accent); }
    .anchor-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .anchor-toolbar select { min-height: 34px; padding: 4px 8px; }
    .anchor-message { flex: 1 1 220px; color: var(--muted); font-size: 12px; }
    .timeline-stage { position: relative; display: grid; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .anchor-connectors { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
    .crosslink-timelines { position: relative; z-index: 2; display: grid; gap: 8px; }
    .timeline-row { position: relative; min-height: 58px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 8px; background: #09121b; }
    .timeline-label { position: relative; z-index: 4; color: var(--muted); font-size: 10px; }
    .timeline-track { position: absolute; left: 62px; right: 9px; top: 26px; height: 20px; border-radius: 5px; background: linear-gradient(90deg, #182838, #284057); }
    .anchor-marker { position: absolute; top: 2px; width: 16px; height: 16px; padding: 0; min-height: 0; border: 2px solid #071018; border-radius: 3px; background: var(--accent-2); transform: translateX(-50%) rotate(45deg); z-index: 5; }
    .anchor-marker.selected { background: var(--accent); box-shadow: 0 0 0 2px #fff; }
    .viewer-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .viewer-toolbar label { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
    .viewport-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; min-width: 0; }
    .viewport-stack { display: grid; align-content: start; gap: 5px; min-width: 0; }
    .viewport-card { position: relative; min-width: 0; min-height: 240px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #000; }
    .viewport-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .viewport-card canvas { display: block; width: 100%; height: 100%; min-height: 240px; touch-action: none; cursor: crosshair; }
    .viewport-hud { position: absolute; inset: 7px 9px auto 9px; display: flex; justify-content: space-between; pointer-events: none; color: #d9f5f1; font-size: 11px; text-shadow: 0 1px 3px #000; }
    .viewport-filename { min-width: 0; overflow: hidden; padding: 0 4px; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .mpr-layout { display: grid; gap: 12px; min-width: 0; }
    .mpr-region { min-width: 0; padding: 9px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .mpr-region h2 { margin: 0 0 8px; font-size: 13px; }
    .primary-mpr-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .secondary-mpr-regions { display: grid; align-content: start; gap: 10px; min-width: 0; }
    .secondary-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .secondary-grid .viewport-card { min-height: 170px; }
    .secondary-grid .viewport-card canvas { min-height: 170px; }
    .oblique-controls { display: flex; flex-wrap: wrap; gap: 7px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .oblique-controls label { display: grid; gap: 3px; color: var(--muted); font-size: 11px; }
    .oblique-controls input { width: 92px; padding: 4px 6px; }
    .geometry-warning { display: none; padding: 8px 10px; border: 1px solid var(--accent-2); border-radius: 9px; color: #ffd698; background: #2a2114; font-size: 12px; }
    .geometry-warning.visible { display: block; }
    @media (min-width: 1400px) {
      .mpr-layout { grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); align-items: start; }
    }
    @media (max-width: 900px) {
      .body { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .mpr-layout { grid-template-columns: 1fr; }
      .primary-mpr-grid, .secondary-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1>影像序列 Crosslink 與 MPR</h1>
      <span class="privacy">全程本機處理，不上傳影像</span>
    </header>
    <div class="body">
      <aside class="sidebar">
        <section class="section">
          <h2>1. 載入與分組</h2>
          <label class="file-button">選取或拖入 PNG / JPG
            <input id="image-file-input" type="file" multiple accept=".png,.jpg,.jpeg,image/png,image/jpeg">
          </label>
          <label class="field">Sequence 數量
            <select id="sequence-count">
              <option value="2" selected>2 組</option>
              <option value="3">3 組</option>
            </select>
          </label>
          <div id="import-status" class="status" role="status">尚未載入影像</div>
        </section>
        <section class="section">
          <h2>2. Sequence 編排</h2>
          <div id="organizer">
            <div id="boundary-controls"><div class="status">載入後顯示可拖曳分界。</div></div>
            <div id="sequence-lanes"><div class="status">縮圖會依自然檔名排序。</div></div>
            <button id="build-volumes" class="primary-action" type="button" disabled>建立本機 Volumes</button>
            <div id="volume-status" class="status" role="status"></div>
          </div>
        </section>
      </aside>
      <main class="main">
        <nav class="mode-tabs" aria-label="工作模式">
          <button id="crosslink-tab" type="button" aria-selected="true">Crosslink</button>
          <button id="mpr-tab" type="button" aria-selected="false">MPR</button>
        </nav>
        <div id="viewer-toolbar" class="viewer-toolbar">
          <label><input id="sync-navigation" type="checkbox" checked>同步縮放／平移</label>
          <label><input id="sync-intensity" type="checkbox" checked>同步 Intensity</label>
          <button id="fit-view" type="button">Fit</button>
          <button id="reset-view" type="button">Reset</button>
          <button id="invert-view" type="button">Invert</button>
          <span class="status">滾輪：切片；Ctrl/Meta＋滾輪：縮放；Shift＋拖曳：平移；右鍵拖曳：Intensity</span>
        </div>
        <section id="crosslink-workspace" class="workspace">
          <div id="axial-viewports" class="empty-panel">載入至少兩組影像後，可滾動 axial 並建立跨序列錨點。</div>
          <div id="anchor-toolbar" class="anchor-toolbar">
            <label>配對目標
              <select id="anchor-target"><option value="2">Sequence 2</option></select>
            </label>
            <button id="add-anchor" type="button">新增目前切片錨點</button>
            <button id="update-anchor" type="button" disabled>更新所選錨點</button>
            <button id="delete-anchor" type="button" disabled>刪除所選錨點</button>
            <span id="anchor-message" class="anchor-message">目前切片尚未配對。</span>
          </div>
          <div class="timeline-stage">
            <svg id="anchor-connectors" class="anchor-connectors" aria-hidden="true"></svg>
            <div id="crosslink-timelines" class="crosslink-timelines"></div>
          </div>
        </section>
        <section id="mpr-workspace" class="workspace" hidden>
          <div id="geometry-warning" class="geometry-warning">來源比例未知；重組影像僅供定位，不作距離判讀。</div>
          <div class="oblique-controls">
            <label>Azimuth°<input id="oblique-azimuth" type="number" min="-180" max="180" step="1" value="0"></label>
            <label>Tilt°<input id="oblique-tilt" type="number" min="-90" max="90" step="1" value="0"></label>
            <label>Roll°<input id="oblique-roll" type="number" min="-180" max="180" step="1" value="0"></label>
            <button id="oblique-reset" type="button">Oblique Reset</button>
          </div>
          <div id="mpr-layout" class="mpr-layout">
            <section class="mpr-region">
              <h2>Sequence 1 · 主要 2×2 MPR</h2>
              <div id="primary-mpr-grid" class="primary-mpr-grid"><div class="empty-panel">建立 volume 後顯示 AX、COR、SAG 與 Oblique。</div></div>
            </section>
            <aside id="secondary-mpr-regions" class="secondary-mpr-regions"></aside>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script id="image-stack-mpr-core">
  (function (root) {
    "use strict";

    const MEMORY_CONFIRM_BYTES = 512 * 1024 * 1024;

    function naturalCompare(a, b) {
      const left = String(a).toLocaleLowerCase().match(/\d+|\D+/g) || [];
      const right = String(b).toLocaleLowerCase().match(/\d+|\D+/g) || [];
      const count = Math.max(left.length, right.length);
      for (let index = 0; index < count; index += 1) {
        if (left[index] === undefined) return -1;
        if (right[index] === undefined) return 1;
        const leftNumber = /^\d+$/.test(left[index]);
        const rightNumber = /^\d+$/.test(right[index]);
        if (leftNumber && rightNumber) {
          const difference = Number(left[index]) - Number(right[index]);
          if (difference) return difference;
          continue;
        }
        if (left[index] < right[index]) return -1;
        if (left[index] > right[index]) return 1;
      }
      return 0;
    }

    function validateSequenceCount(sequenceCount) {
      const count = Number(sequenceCount);
      if (count !== 2 && count !== 3) throw new RangeError("sequenceCount must be 2 or 3");
      return count;
    }

    function normalizeBoundaries(length, sequenceCount, boundaries) {
      const count = validateSequenceCount(sequenceCount);
      if (!Array.isArray(boundaries) || boundaries.length !== count - 1) {
        throw new RangeError("boundary count does not match sequence count");
      }
      const normalized = boundaries.map(Number);
      normalized.forEach(function (boundary, index) {
        if (!Number.isInteger(boundary) || boundary < 0 || boundary > length) {
          throw new RangeError("boundary is outside the item range");
        }
        if (index && boundary < normalized[index - 1]) {
          throw new RangeError("boundaries must be ordered");
        }
      });
      return normalized;
    }

    function assignByBoundaries(items, sequenceCount, boundaries) {
      const normalized = normalizeBoundaries(items.length, sequenceCount, boundaries);
      return items.map(function (item, index) {
        let sequenceId = 1;
        while (sequenceId <= normalized.length && index >= normalized[sequenceId - 1]) {
          sequenceId += 1;
        }
        return Object.assign({}, item, {
          included: item.included !== false,
          sequenceId,
          sortIndex: Number.isFinite(item.sortIndex) ? item.sortIndex : index
        });
      });
    }

    function reassignItem(items, itemId, sequenceId, sequenceCount) {
      const count = validateSequenceCount(sequenceCount);
      const target = Number(sequenceId);
      if (!Number.isInteger(target) || target < 1 || target > count) {
        throw new RangeError("target sequence is not active");
      }
      return items.map(function (item) {
        return item.id === itemId ? Object.assign({}, item, { sequenceId: target }) : Object.assign({}, item);
      });
    }

    function setItemIncluded(items, itemId, included) {
      return items.map(function (item) {
        return item.id === itemId ? Object.assign({}, item, { included: Boolean(included) }) : Object.assign({}, item);
      });
    }

    function positiveNumber(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? number : fallback;
    }

    function normalizeGeometry(input) {
      const source = input || {};
      const pixelSpacingX = positiveNumber(source.pixelSpacingX, 1);
      const pixelSpacingY = positiveNumber(source.pixelSpacingY, 1);
      const sliceSpacing = positiveNumber(source.sliceSpacing, 5);
      const spacingWasValid = Number(source.pixelSpacingX) > 0
        && Number(source.pixelSpacingY) > 0
        && Number(source.sliceSpacing) > 0;
      const rotations = [0, 90, 180, 270];
      return {
        orientation: "axial",
        pixelSpacingX,
        pixelSpacingY,
        sliceSpacing,
        order: source.order === "reverse" ? "reverse" : "forward",
        rotation: rotations.includes(Number(source.rotation)) ? Number(source.rotation) : 0,
        flipX: source.flipX === true,
        flipY: source.flipY === true,
        unknownScale: source.unknownScale === true || !spacingWasValid
      };
    }

    function canonicalDimensions(sourceWidth, sourceHeight, depth, geometry) {
      const rotation = normalizeGeometry(geometry).rotation;
      return rotation === 90 || rotation === 270
        ? { width: sourceHeight, height: sourceWidth, depth }
        : { width: sourceWidth, height: sourceHeight, depth };
    }

    function canonicalToSource(x, y, z, sourceWidth, sourceHeight, depth, geometry) {
      const normalized = normalizeGeometry(geometry);
      const dimensions = canonicalDimensions(sourceWidth, sourceHeight, depth, normalized);
      const canonicalX = normalized.flipX ? dimensions.width - 1 - x : x;
      const canonicalY = normalized.flipY ? dimensions.height - 1 - y : y;
      let sourceX;
      let sourceY;
      if (normalized.rotation === 90) {
        sourceX = canonicalY;
        sourceY = sourceHeight - 1 - canonicalX;
      } else if (normalized.rotation === 180) {
        sourceX = sourceWidth - 1 - canonicalX;
        sourceY = sourceHeight - 1 - canonicalY;
      } else if (normalized.rotation === 270) {
        sourceX = sourceWidth - 1 - canonicalY;
        sourceY = canonicalX;
      } else {
        sourceX = canonicalX;
        sourceY = canonicalY;
      }
      return {
        x: sourceX,
        y: sourceY,
        z: normalized.order === "reverse" ? depth - 1 - z : z
      };
    }

    function canonicalSliceNames(items, geometry) {
      if (!items.length) return [];
      return items.map(function (_, canonicalZ) {
        const sourceZ = canonicalToSource(
          0,
          0,
          canonicalZ,
          items[0].width,
          items[0].height,
          items.length,
          geometry
        ).z;
        return items[sourceZ].name;
      });
    }

    function sliceNameAtPosition(sliceNames, position) {
      if (!sliceNames.length) return "";
      const index = Math.max(
        0,
        Math.min(sliceNames.length - 1, Math.round(Number(position) || 0))
      );
      return sliceNames[index];
    }

    function validateDecodedSequence(entries, geometry) {
      const errors = [];
      const decoded = entries.filter(function (entry) {
        if (entry.ok === false) {
          errors.push(`${entry.name}: 無法解碼`);
          return false;
        }
        return true;
      });
      if (decoded.length < 2) errors.push("每個 sequence 至少 2 張有效影像");
      let dimensions = null;
      decoded.forEach(function (entry) {
        const current = canonicalDimensions(entry.width, entry.height, decoded.length, geometry);
        if (!dimensions) {
          dimensions = current;
        } else if (current.width !== dimensions.width || current.height !== dimensions.height) {
          errors.push(`${entry.name}: canonical 尺寸不一致`);
        }
      });
      return {
        valid: errors.length === 0,
        errors,
        width: dimensions ? dimensions.width : 0,
        height: dimensions ? dimensions.height : 0,
        depth: decoded.length
      };
    }

    function estimateVolumeBytes(sequences) {
      return sequences.reduce(function (total, sequence) {
        return total + Number(sequence.width) * Number(sequence.height) * Number(sequence.depth);
      }, 0);
    }

    function requiresMemoryConfirmation(bytes) {
      return Number(bytes) >= MEMORY_CONFIRM_BYTES;
    }

    function allocateVolume(specification, allocator) {
      const size = Number(specification.width) * Number(specification.height) * Number(specification.depth);
      const create = typeof allocator === "function" ? allocator : function (length) { return new Uint8Array(length); };
      try {
        return {
          ok: true,
          sequenceId: specification.sequenceId,
          data: create(size),
          bytes: size
        };
      } catch (error) {
        return {
          ok: false,
          sequenceId: specification.sequenceId,
          error: error instanceof Error ? error.message : String(error),
          bytes: size
        };
      }
    }
    function createCrosslinkMaps(sequenceCount) {
      const count = validateSequenceCount(sequenceCount);
      const maps = {};
      for (let sequenceId = 2; sequenceId <= count; sequenceId += 1) maps[sequenceId] = [];
      return maps;
    }

    function cloneAnchors(anchors) {
      return anchors.map(function (anchor) {
        return {
          referenceIndex: Number(anchor.referenceIndex),
          targetIndex: Number(anchor.targetIndex)
        };
      });
    }

    function validateAnchor(candidate, anchors) {
      const referenceIndex = Number(candidate.referenceIndex);
      const targetIndex = Number(candidate.targetIndex);
      if (!Number.isFinite(referenceIndex) || !Number.isFinite(targetIndex)) {
        return { valid: false, reason: "anchor index 必須是數字" };
      }
      if (anchors.some(function (anchor) { return Number(anchor.referenceIndex) === referenceIndex; })) {
        return { valid: false, reason: "duplicate reference index" };
      }
      if (anchors.some(function (anchor) { return Number(anchor.targetIndex) === targetIndex; })) {
        return { valid: false, reason: "duplicate target index" };
      }
      const combined = cloneAnchors(anchors).concat([{ referenceIndex, targetIndex }]).sort(function (left, right) {
        return left.referenceIndex - right.referenceIndex;
      });
      for (let index = 1; index < combined.length; index += 1) {
        if (combined[index].targetIndex <= combined[index - 1].targetIndex) {
          return { valid: false, reason: "reference 與 target 必須維持嚴格單調" };
        }
      }
      return { valid: true, reason: "" };
    }

    function upsertAnchor(anchors, candidate, editIndex) {
      const original = cloneAnchors(anchors);
      const base = cloneAnchors(anchors);
      if (Number.isInteger(editIndex) && editIndex >= 0 && editIndex < base.length) base.splice(editIndex, 1);
      const validation = validateAnchor(candidate, base);
      if (!validation.valid) return { valid: false, reason: validation.reason, anchors: original };
      base.push({
        referenceIndex: Number(candidate.referenceIndex),
        targetIndex: Number(candidate.targetIndex)
      });
      base.sort(function (left, right) { return left.referenceIndex - right.referenceIndex; });
      return { valid: true, reason: "", anchors: base };
    }

    function deleteAnchor(anchors, index) {
      return cloneAnchors(anchors).filter(function (_, anchorIndex) { return anchorIndex !== Number(index); });
    }

    function clampPosition(position, depth) {
      return Math.max(0, Math.min(Math.max(0, Number(depth) - 1), Number(position)));
    }

    function mapPiecewise(position, anchors, sourceKey, targetKey, targetDepth) {
      if (!anchors.length) return null;
      const ordered = cloneAnchors(anchors).sort(function (left, right) {
        return left[sourceKey] - right[sourceKey];
      });
      let mapped;
      if (ordered.length === 1) {
        mapped = Number(position) + ordered[0][targetKey] - ordered[0][sourceKey];
      } else {
        let left = ordered[0];
        let right = ordered[1];
        if (Number(position) >= ordered[ordered.length - 1][sourceKey]) {
          left = ordered[ordered.length - 2];
          right = ordered[ordered.length - 1];
        } else if (Number(position) > ordered[0][sourceKey]) {
          for (let index = 1; index < ordered.length; index += 1) {
            if (Number(position) <= ordered[index][sourceKey]) {
              left = ordered[index - 1];
              right = ordered[index];
              break;
            }
          }
        }
        const sourceSpan = right[sourceKey] - left[sourceKey];
        const targetSpan = right[targetKey] - left[targetKey];
        mapped = left[targetKey] + (Number(position) - left[sourceKey]) * targetSpan / sourceSpan;
      }
      return clampPosition(mapped, targetDepth);
    }

    function mapReferenceToTarget(position, anchors, targetDepth) {
      return mapPiecewise(position, anchors, "referenceIndex", "targetIndex", targetDepth);
    }

    function mapTargetToReference(position, anchors, referenceDepth) {
      return mapPiecewise(position, anchors, "targetIndex", "referenceIndex", referenceDepth);
    }

    function synchronizePositions(sourceId, position, maps, depths, currentPositions) {
      const source = Number(sourceId);
      const result = Object.assign({}, currentPositions);
      result[source] = clampPosition(position, depths[source]);
      let referencePosition = result[source];

    }
    function sampleTrilinear(volume, x, y, z) {
      const px = Number(x);
      const py = Number(y);
      const pz = Number(z);
      if (!Number.isFinite(px) || !Number.isFinite(py) || !Number.isFinite(pz)
          || px < 0 || py < 0 || pz < 0
          || px > volume.width - 1 || py > volume.height - 1 || pz > volume.depth - 1) return 0;
      const x0 = Math.floor(px);
      const y0 = Math.floor(py);
      const z0 = Math.floor(pz);
      const x1 = Math.min(volume.width - 1, x0 + 1);
      const y1 = Math.min(volume.height - 1, y0 + 1);
      const z1 = Math.min(volume.depth - 1, z0 + 1);
      const tx = px - x0;
      const ty = py - y0;
      const tz = pz - z0;
      const value = function (vx, vy, vz) {
        return Number(volume.data[vz * volume.width * volume.height + vy * volume.width + vx]);
      };
      const c00 = value(x0, y0, z0) * (1 - tx) + value(x1, y0, z0) * tx;
      const c10 = value(x0, y1, z0) * (1 - tx) + value(x1, y1, z0) * tx;
      const c01 = value(x0, y0, z1) * (1 - tx) + value(x1, y0, z1) * tx;
      const c11 = value(x0, y1, z1) * (1 - tx) + value(x1, y1, z1) * tx;
      const c0 = c00 * (1 - ty) + c10 * ty;
      const c1 = c01 * (1 - ty) + c11 * ty;
      return c0 * (1 - tz) + c1 * tz;
    }

    function copyPoint(point) {
      return { x: Number(point.x), y: Number(point.y), z: Number(point.z) };
    }

    function makeOrthogonalPlane(kind, volume, center) {
      const planeKind = String(kind).toUpperCase();
      const definitions = {
        AX: {
          u: { x: 1, y: 0, z: 0 },
          v: { x: 0, y: 1, z: 0 },
          normal: { x: 0, y: 0, z: 1 },
          labels: { left: "R", right: "L", top: "A", bottom: "P" }
        },
        COR: {
          u: { x: 1, y: 0, z: 0 },
          v: { x: 0, y: 0, z: 1 },
          normal: { x: 0, y: 1, z: 0 },
          labels: { left: "R", right: "L", top: "S", bottom: "I" }
        },
        SAG: {
          u: { x: 0, y: 1, z: 0 },
          v: { x: 0, y: 0, z: 1 },
          normal: { x: 1, y: 0, z: 0 },
          labels: { left: "A", right: "P", top: "S", bottom: "I" }
        }
      };
      if (!definitions[planeKind]) throw new RangeError("plane kind must be AX, COR, or SAG");
      return Object.assign({
        kind: planeKind,
        center: copyPoint(center),
        mmPerPixelX: Math.min(volume.pixelSpacingX || 1, volume.pixelSpacingY || 1),
        mmPerPixelY: Math.min(volume.pixelSpacingX || 1, volume.pixelSpacingY || 1)
      }, definitions[planeKind]);
    }

    function makeObliquePlane(volume, center, angles) {
      const source = angles || {};
      const azimuth = Number(source.azimuth || 0) * Math.PI / 180;
      const tilt = Number(source.tilt || 0) * Math.PI / 180;
      const roll = Number(source.roll || 0) * Math.PI / 180;
      const ca = Math.cos(azimuth);
      const sa = Math.sin(azimuth);
      const ct = Math.cos(tilt);
      const st = Math.sin(tilt);
      const cr = Math.cos(roll);
      const sr = Math.sin(roll);
      const u0 = { x: ca * ct, y: sa * ct, z: -st };
      const v0 = { x: -sa, y: ca, z: 0 };
      const normal = { x: ca * st, y: sa * st, z: ct };
      const u = {
        x: u0.x * cr + v0.x * sr,
        y: u0.y * cr + v0.y * sr,
        z: u0.z * cr + v0.z * sr
      };
      const v = {
        x: -u0.x * sr + v0.x * cr,
        y: -u0.y * sr + v0.y * cr,
        z: -u0.z * sr + v0.z * cr
      };
      return {
        kind: "OBLIQUE",
        center: copyPoint(center),
        u,
        v,
        normal,
        angles: {
          azimuth: Number(source.azimuth || 0),
          tilt: Number(source.tilt || 0),
          roll: Number(source.roll || 0)
        },
        labels: { left: "−u", right: "+u", top: "−v", bottom: "+v" },
        mmPerPixelX: Math.min(volume.pixelSpacingX || 1, volume.pixelSpacingY || 1),
        mmPerPixelY: Math.min(volume.pixelSpacingX || 1, volume.pixelSpacingY || 1)
      };
    }

    function reslicePlane(volume, plane, outputWidth, outputHeight) {
      const width = Math.max(1, Math.floor(Number(outputWidth)));
      const height = Math.max(1, Math.floor(Number(outputHeight)));
      const result = new Uint8ClampedArray(width * height * 4);
      const spacingX = positiveNumber(volume.pixelSpacingX, 1);
      const spacingY = positiveNumber(volume.pixelSpacingY, 1);
      const spacingZ = positiveNumber(volume.sliceSpacing, 5);
      const mmPerPixelX = positiveNumber(plane.mmPerPixelX, 1);
      const mmPerPixelY = positiveNumber(plane.mmPerPixelY, 1);
      const intensity = plane.intensity || {};
      const intensityWidth = positiveNumber(intensity.width, 255);
      const intensityCenter = Number.isFinite(Number(intensity.center)) ? Number(intensity.center) : 127.5;
      const low = intensityCenter - intensityWidth / 2;
      for (let outputY = 0; outputY < height; outputY += 1) {
        const millimetresY = (outputY - (height - 1) / 2) * mmPerPixelY;
        for (let outputX = 0; outputX < width; outputX += 1) {
          const millimetresX = (outputX - (width - 1) / 2) * mmPerPixelX;
          const x = plane.center.x + (plane.u.x * millimetresX + plane.v.x * millimetresY) / spacingX;
          const y = plane.center.y + (plane.u.y * millimetresX + plane.v.y * millimetresY) / spacingY;
          const z = plane.center.z + (plane.u.z * millimetresX + plane.v.z * millimetresY) / spacingZ;
          const sampled = sampleTrilinear(volume, x, y, z);
          let displayed = 255 * (sampled - low) / intensityWidth;
          displayed = Math.max(0, Math.min(255, displayed));
          if (intensity.invert === true) displayed = 255 - displayed;
          const offset = (outputY * width + outputX) * 4;
          result[offset] = displayed;
          result[offset + 1] = displayed;
          result[offset + 2] = displayed;
          result[offset + 3] = 255;
        }
      }
      return result;
    }
    function fitRenderSize(width, height, maximumDimension) {
      const safeWidth = Math.max(1, Number(width));
      const safeHeight = Math.max(1, Number(height));
      const scale = Math.min(1, Number(maximumDimension) / Math.max(safeWidth, safeHeight));
      return {
        width: Math.max(1, Math.round(safeWidth * scale)),
        height: Math.max(1, Math.round(safeHeight * scale))
      };
    }

    function progressiveRenderPlan(cssWidth, cssHeight, devicePixelRatio, generation) {
      const ratio = positiveNumber(devicePixelRatio, 1);
      const deviceWidth = Math.max(1, Number(cssWidth) * ratio);
      const deviceHeight = Math.max(1, Number(cssHeight) * ratio);
      return {
        preview: fitRenderSize(deviceWidth, deviceHeight, 256),
        full: fitRenderSize(deviceWidth, deviceHeight, 1024),
        delayMs: 120,
        generation: Number(generation)
      };
    }

    function isRenderGenerationCurrent(resultGeneration, currentGeneration) {
      return Number(resultGeneration) === Number(currentGeneration);
    }

    root.ImageStackMprCore = Object.freeze({
      naturalCompare,
      assignByBoundaries,
      reassignItem,
      setItemIncluded,
      canonicalDimensions,
      canonicalToSource,
      canonicalSliceNames,
      sliceNameAtPosition,
      normalizeGeometry,
      estimateVolumeBytes,
      requiresMemoryConfirmation,
      allocateVolume,
      validateDecodedSequence,
      createCrosslinkMaps,
      validateAnchor,
      upsertAnchor,
      deleteAnchor,
      mapReferenceToTarget,
      mapTargetToReference,
      synchronizePositions,

      makeOrthogonalPlane,
      makeObliquePlane,
      reslicePlane,
      progressiveRenderPlan,
