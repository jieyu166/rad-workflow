  { id: "自強281", type: "自強", from: "花蓮", to: "屏東", times: { 新營: "23:20", 善化: null, 大橋: null, 台南: "23:46", 新左營: "00:12", 美術館: null, 高雄: "00:23" } },
];

const northStations = ["高雄", "美術館", "新左營", "台南", "大橋", "善化", "新營"];
const southStations = ["新營", "善化", "大橋", "台南", "新左營", "美術館", "高雄"];
const keyStations = ["高雄", "新左營", "台南"];

const getTrainTypeColor = (type) => {
  switch (type) {
    case "自強": case "自強(3000)": return "bg-red-100 text-red-800 border-red-300";
    case "區間快": return "bg-blue-100 text-blue-800 border-blue-300";
    case "區間": return "bg-green-100 text-green-800 border-green-300";
    case "莒光": return "bg-orange-100 text-orange-800 border-orange-300";
    case "普悠瑪": return "bg-purple-100 text-purple-800 border-purple-300";
    default: return "bg-gray-100 text-gray-800 border-gray-300";
  }
};

const getTrainTypeBadge = (type) => {
  switch (type) {
    case "自強": case "自強(3000)": return "bg-red-500";
    case "區間快": return "bg-blue-500";
    case "區間": return "bg-green-500";
    case "莒光": return "bg-orange-500";
    case "普悠瑪": return "bg-purple-500";
    default: return "bg-gray-500";
  }
};

// 沙崙支線列車（台南以南經中洲進出沙崙），起訖站含「沙崙」
const isShalun = (train) => (train.from + train.to).includes("沙崙");

const timeToMinutes = (time) => {
  if (!time) return null;
  const [h, m] = time.split(":").map(Number);
  return h * 60 + m;
};

function TrainTimetable() {
  const [isNorthbound, setIsNorthbound] = useState(true);
  const [showOnlyKeyStations, setShowOnlyKeyStations] = useState(false);
  const [selectedType, setSelectedType] = useState("all");
  const [fromStation, setFromStation] = useState("all");
  const [toStation, setToStation] = useState("all");
  const [onlyShalun, setOnlyShalun] = useState(false);

  const trains = isNorthbound ? northTrains : southTrains;
  const stations = isNorthbound ? northStations : southStations;
  const displayStations = showOnlyKeyStations
    ? stations.filter(s => keyStations.includes(s))
    : stations;

  const filteredTrains = useMemo(() => {
    let result = trains;

    if (selectedType !== "all") {
      if (selectedType === "自強") {
        result = result.filter(train => train.type === "自強" || train.type === "自強(3000)");
      } else {
        result = result.filter(train => train.type === selectedType);
      }
    }

    if (fromStation !== "all") {
      result = result.filter(train => train.times[fromStation]);
    }
    if (toStation !== "all") {
      result = result.filter(train => train.times[toStation]);
    }
    if (fromStation !== "all" && toStation !== "all" && stations.indexOf(fromStation) >= stations.indexOf(toStation)) {
      result = [];
    }

    if (onlyShalun) {
      result = result.filter(isShalun);
    }

    const sortKey = fromStation !== "all" ? [fromStation] : stations;
    return [...result].sort((a, b) => {
      const aTime = sortKey.map(s => timeToMinutes(a.times[s])).find(t => t !== null && t !== undefined) || 0;
      const bTime = sortKey.map(s => timeToMinutes(b.times[s])).find(t => t !== null && t !== undefined) || 0;
      return aTime - bTime;
    });
  }, [trains, stations, selectedType, fromStation, toStation, onlyShalun]);

  const switchDirection = (north) => {
    setIsNorthbound(north);
    setFromStation("all");
    setToStation("all");
  };

  return (
    <div className="min-h-screen bg-gray-50 p-4">
      <div className="max-w-7xl mx-auto">
        <div className="bg-white rounded-lg shadow-lg p-6 mb-4">
          <div className="flex items-center justify-between mb-4">
            <div>
              <h1 className="text-2xl font-bold text-gray-800">台鐵西部幹線時刻表</h1>
              <p className="text-sm text-gray-500">平日時刻（資料日期 2026/08/17 週一）</p>
            </div>
            <a href="https://www.railway.gov.tw" target="_blank" rel="noopener noreferrer"
               className="text-sm text-blue-600 hover:underline">
              資料來源：國營臺灣鐵路公司
            </a>
          </div>

          <div className="flex flex-wrap gap-4 items-center">
            <div className="flex bg-gray-200 rounded-lg p-1">
              <button onClick={() => switchDirection(true)}
                className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${
                  isNorthbound ? "bg-blue-600 text-white shadow" : "text-gray-600 hover:bg-gray-300"
                }`}>
                北上 (高雄→新營)
              </button>
              <button onClick={() => switchDirection(false)}
                className={`px-4 py-2 rounded-md text-sm font-medium transition-all ${
                  !isNorthbound ? "bg-blue-600 text-white shadow" : "text-gray-600 hover:bg-gray-300"
                }`}>
                南下 (新營→高雄)
              </button>
            </div>

            <select value={selectedType} onChange={(e) => setSelectedType(e.target.value)}
              className="px-3 py-2 border rounded-lg text-sm">
              <option value="all">全部車種</option>
              <option value="自強">自強號</option>
              <option value="區間快">區間快</option>
              <option value="區間">區間車</option>
              <option value="莒光">莒光號</option>
              <option value="普悠瑪">普悠瑪</option>
            </select>

            <div className="flex items-center gap-2 text-sm">
              <select value={fromStation} onChange={(e) => setFromStation(e.target.value)}
                className="px-3 py-2 border rounded-lg text-sm">
                <option value="all">起站（不限）</option>
                {stations.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <span className="text-gray-400">&rarr;</span>
              <select value={toStation} onChange={(e) => setToStation(e.target.value)}
                className="px-3 py-2 border rounded-lg text-sm">
                <option value="all">迄站（不限）</option>
                {stations.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>

            <label className="flex items-center gap-2 text-sm text-gray-600">
              <input type="checkbox" checked={showOnlyKeyStations}
                onChange={(e) => setShowOnlyKeyStations(e.target.checked)} />
              只顯示主要車站
            </label>

            <label className="flex items-center gap-2 text-sm text-amber-700">
              <input type="checkbox" checked={onlyShalun}
                onChange={(e) => setOnlyShalun(e.target.checked)} />
              只看沙崙支線
            </label>

            <span className="text-sm text-gray-500">共 {filteredTrains.length} 班次</span>
          </div>

          <div className="mt-4 flex items-center gap-2 text-sm text-gray-600">
            <span className="font-medium">行駛方向：</span>
            <div className="flex items-center gap-1 flex-wrap">
              {stations.map((s, i) => (
                <Fragment key={s}>
                  <span className={keyStations.includes(s) ? "font-bold text-blue-600" : ""}>{s}</span>
                  {i < stations.length - 1 && <span className="text-gray-400">&rarr;</span>}
                </Fragment>
              ))}
            </div>
          </div>

          <div className="mt-4 flex flex-wrap gap-2">
            <span className="text-xs text-gray-500">車種圖例：</span>
            {["自強", "區間快", "區間", "莒光", "普悠瑪"].map(type => (
              <span key={type} className={`px-2 py-0.5 rounded text-xs ${getTrainTypeColor(type)}`}>{type}</span>
            ))}
          </div>
        </div>

        <div className="bg-white rounded-lg shadow-lg overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full">
              <thead>
                <tr className="bg-gray-800 text-white">
                  <th className="px-3 py-3 text-left text-sm font-semibold sticky left-0 bg-gray-800 z-10 min-w-32">車次</th>
                  {displayStations.map(station => (
                    <th key={station}
                      className={`px-4 py-3 text-center text-sm font-semibold min-w-20 ${
                        keyStations.includes(station) ? "bg-blue-900" : ""
                      }`}>
                      {station}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-200">
                {filteredTrains.map((train, idx) => (
                  <tr key={train.id + idx}
                    className={`hover:bg-gray-50 ${idx % 2 === 0 ? "bg-white" : "bg-gray-50"}`}>
                    <td className="px-3 py-2 sticky left-0 bg-inherit z-10">
                      <div className="flex items-center gap-2">
                        <span className={`w-2 h-2 rounded-full ${getTrainTypeBadge(train.type)}`}></span>
                        <span className={`text-xs px-1.5 py-0.5 rounded border ${getTrainTypeColor(train.type)}`}>
                          {train.id}
                        </span>
                      </div>
                      {train.to && (
                        <div className={`mt-0.5 text-[11px] ${
                          isShalun(train) ? "text-amber-700 font-medium" : "text-gray-400"
                        }`}>
                          {train.from} &rarr; {train.to}
                        </div>
                      )}
                    </td>
                    {displayStations.map(station => {
                      const time = train.times[station];
                      return (
                        <td key={station}
                          className={`px-4 py-2 text-center text-sm ${
                            keyStations.includes(station) ? "bg-blue-50" : ""
                          }`}>
                          {time ? (
                            <span className="font-mono">{time}</span>
                          ) : (
                            <span className="text-gray-300">│</span>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="mt-4 text-center text-xs text-gray-500">
          <p>「│」表示該列車不停靠此站（可能過站不停或未經該站）</p>
          <p className="mt-1">高雄、新左營、台南 為主要轉乘站，以藍色底色標示</p>
          <p className="mt-1">車次下方為該班車起訖站；橘色標示者為沙崙支線列車（台南 &harr; 沙崙，經中洲）</p>
          <p className="mt-1">時刻為該站開車時間，實際請以台鐵公告為準</p>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TrainTimetable />);
</script>
</body>
</html>
