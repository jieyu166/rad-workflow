# Patterns a rendered note must not contain (rule R7 of the writing guideline).
#
# Python regular expressions, written as TOML literal strings so a backslash
# means a backslash and nothing has to be double-escaped.
#
# `patterns` is ONE key and the layers merge key by key, so this list REPLACES
# the radiology profile's list instead of adding to it. Every pattern of that
# profile is restated below; the last entry is the only one this overlay adds.

patterns = [
  # Taiwan national identification number: a letter, 1 or 2, then eight digits.
  '\b[A-Za-z][12]\d{8}\b',
  # A medical record or chart number written out with its label.
  '(病歷號|病歷號碼|[Cc]hart [Nn]o\.?|[Cc]hart number)\s*[:：]?\s*\w{6,}',
  # A bare eight-digit chart number, the local format, with no label at all.
  #
  # A yyyymmdd date is NOT a chart number: a valid date shape (1900-2099, month
  # 01-12, day 01-31) is excluded. Lecture stems, file names and frame embeds
  # are routinely dates -- `l2n render` writes the stem into the frontmatter
  # `source:`, the References block and every `![[frames/<stem>-NNNN.png]]` --
  # and every one of those findings was a false positive. Any other bare
  # eight-digit run is still an error.
  '(?<!\d)(?!(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])(?!\d))\d{8}(?!\d)',
  # A patient named after the word for patient.
  '病患\s*[:：]\s*\S+',
  '病人\s*[:：]\s*\S+',
  # A phone number written out with its label.
  '(電話|手機|聯絡電話)\s*[:：]?\s*[\d\-() ]{8,}',
  # An e-mail address.
  '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}',
  # A radtracker case_id: eight digits (which ARE the chart number) followed by
  # a separator and a suffix. The bare-eight-digit pattern above already
  # catches the prefix; this one names the composite form so a finding says
  # what it found. No real case_id is written anywhere in this repository.
  # A date prefix is excluded for the same reason as above: `20230215-0000.png`
  # is a frame file name, not a case_id.
  '\b(?!(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])[-_])\d{8}[-_][A-Za-z0-9]{1,}\b',
]
